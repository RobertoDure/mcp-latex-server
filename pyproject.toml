[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-latex-server"
version = "3.0.0"
description = "MCP server for LaTeX authoring, project analysis, quality checks, PDF inspection, and compilation"
readme = "README.md"
requires-python = ">=3.11.9"
license = { text = "MIT" }
authors = [{ name = "MCP LaTeX Server contributors" }]
keywords = ["mcp", "latex", "model-context-protocol", "pdf", "authoring"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup :: LaTeX",
]
dependencies = [
    "mcp[cli]>=1.9.4",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "pypdf>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
mcp-latex-server = "mcp_latex_server.server:main"

[project.urls]
Homepage = "https://github.com/RobertoDure/mcp-latex-server"
Issues = "https://github.com/RobertoDure/mcp-latex-server/issues"
Changelog = "https://github.com/RobertoDure/mcp-latex-server/blob/main/CHANGELOG.md"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mcp_latex_server = ["resources/templates/*.tex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra --basetemp=.pytest_tmp"

[tool.coverage.run]
source = ["mcp_latex_server"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
